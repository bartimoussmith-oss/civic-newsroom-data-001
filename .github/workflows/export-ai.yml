name: export-ai
on:
  push:
    branches: [main]
    paths: ["scripts/export_ai.py", ".github/workflows/export-ai.yml"]
permissions:
  contents: write
concurrency:
  group: publish-public-data
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify publisher syntax
        run: python -m py_compile scripts/export_ai.py
      - name: Verify and materialize direct public-record formats
        run: python scripts/export_ai.py
